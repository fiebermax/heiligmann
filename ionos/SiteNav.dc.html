<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/site.css">
<style>
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 3px solid #C8201E; outline-offset: 3px; border-radius: 2px; }
  a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
  p { text-wrap: pretty; }
  a[href^="tel:"] { font-variant-numeric: tabular-nums; }
  img:not([src$=".svg"]) { background-color: #E4E3E2; }
  a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  @media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
  @media (prefers-reduced-motion: no-preference) {
    img.hm-ph { clip-path: inset(100% 0 0 0); transform: scale(1.18); transition: clip-path 1.1s cubic-bezier(.77,0,.18,1), transform 1.7s cubic-bezier(.16,1,.3,1); }
    img.hm-phc { clip-path: inset(100% 0 0 0); transition: clip-path 1.1s cubic-bezier(.77,0,.18,1); }
    img.hm-ph.hm-in, img.hm-phc.hm-in { clip-path: inset(0 0 0 0); transform: scale(1); }
    img.hm-phc.hm-in { transform: none; }
    img.hm-kb { animation: hm-kb 22s ease-in-out infinite alternate; }
    @keyframes hm-kb { from { transform: scale(1); } to { transform: scale(1.08) translate3d(-1%, -1%, 0); } }
  }
  @keyframes hm-tuck { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(-1.5deg); } }
  .hm-tractor.is-driving { animation: hm-tuck .32s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</helmet>
<header ref="{{ headerRef }}" style="view-transition-name:site-header;position:sticky;top:0;z-index:50;background:{{ headerBg }};backdrop-filter:blur(14px);border-bottom:1px solid {{ lineCol }};transition:box-shadow .3s ease,background .3s ease;font-family:'Source Serif 4',Georgia,serif;">
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:-1px;height:3px;pointer-events:none;"><div ref="{{ trackRef }}" style="height:100%;background:#C8201E;transform:scaleX(0);transform-origin:left center;will-change:transform;"></div></div>
  <div aria-hidden="true" ref="{{ tractorRef }}" style="position:absolute;left:0;bottom:2px;width:26px;height:26px;pointer-events:none;opacity:0;will-change:transform,opacity;transition:opacity .25s ease;"><span class="hm-tractor" style="display:block;width:100%;height:100%;background:#C8201E;-webkit-mask:url(icons/tractor-variant.svg) center/contain no-repeat;mask:url(icons/tractor-variant.svg) center/contain no-repeat;"></span></div>
  <div style="max-width:1200px;margin:0 auto;padding:12px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <a href="./" style="display:inline-flex;align-items:center;text-decoration:none;">
      <img src="logo.svg" alt="Lohnunternehmen Helmut Heiligmann" style="height:46px;display:block;" />
    </a>

    <nav style="display:flex;align-items:center;gap:26px;" ref="{{ deskNavRef }}">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="color:{{ l.col }};font-weight:{{ l.wt }};font-size:15px;text-decoration:none;transition:color .2s;" style-hover="color:#1C1C1C;">{{ l.label }}</a>
      </sc-for>
      <a href="tel:+491623478127" style="display:inline-flex;align-items:center;min-height:44px;color:#1C1C1C;font-family:'Barlow',sans-serif;font-weight:800;font-size:16px;text-decoration:none;" style-hover="color:#C8201E;"><span style="border-bottom:2px solid #E32523;padding-bottom:2px;">0162 3478127</span></a>
    </nav>

    <button onClick="{{ toggleNav }}" aria-label="Menü" style="display:none;background:transparent;border:1px solid #D6D6D5;color:#1C1C1C;width:46px;height:46px;border-radius:4px;font-size:22px;cursor:pointer;" ref="{{ burgerRef }}">☰</button>
  </div>

  <div ref="{{ mobileMenuRef }}" style="display:none;flex-direction:column;padding:8px 18px 20px;border-top:1px solid {{ lineCol }};background:{{ menuBg }};">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
      <a href="{{ l.href }}" onClick="{{ closeNav }}" style="display:block;min-height:48px;color:{{ l.mcol }};font-weight:600;padding:15px 6px;border-bottom:1px solid #EDEDEC;text-decoration:none;">{{ l.label }}</a>
    </sc-for>
    <a href="tel:+491623478127" style="margin-top:14px;text-align:center;background:{{ ctaColor }};color:#fff;font-weight:700;padding:15px;border-radius:4px;text-decoration:none;">Jetzt anrufen: 0162 3478127</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;erd&quot;,&quot;lw&quot;,&quot;angus&quot;,&quot;galerie&quot;,&quot;kontakt&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;ctaColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C8201E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trustColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C8201E&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const accent = this.props.trustColor ?? '#C8201E';
    const defs = [
      { label: 'Start', href: './', key: 'home' },
      { label: 'Erdarbeiten', href: 'erdarbeiten.html', key: 'erd' },
      { label: 'Landwirtschaft', href: 'landwirtschaft.html', key: 'lw' },
      { label: 'Angusrinder', href: 'angusrinder.html', key: 'angus' },
      { label: 'Galerie', href: 'galerie.html', key: 'galerie' },
      { label: 'Kontakt', href: 'kontakt.html', key: 'kontakt' },
    ];
    const links = defs.map(d => {
      const on = d.key === active;
      return { ...d, col: on ? accent : '#4E4C4B', mcol: on ? accent : '#1C1C1C', wt: on ? 700 : 500 };
    });
    return {
      links,
      ctaColor: this.props.ctaColor ?? '#C8201E',
      headerBg: this.props.bg ?? 'rgba(255,255,255,0.95)',
      menuBg: this.props.bg ?? '#FFFFFF',
      lineCol: this.props.line ?? '#E7E7E6',
      headerRef: (el) => { this._header = el; },
      trackRef: (el) => { this._track = el; },
      tractorRef: (el) => { this._tractor = el; },
      deskNavRef: (el) => { this._deskNav = el; },
      burgerRef: (el) => { this._burger = el; },
      mobileMenuRef: (el) => { this._menu = el; },
      toggleNav: () => { if (this._menu) this._menu.style.display = this._menu.style.display === 'flex' ? 'none' : 'flex'; },
      closeNav: () => { if (this._menu) this._menu.style.display = 'none'; },
    };
  }
  componentDidMount() {
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const applyResponsive = () => {
      const mobile = window.innerWidth < 1080;
      if (this._deskNav) this._deskNav.style.display = mobile ? 'none' : 'flex';
      if (this._burger) this._burger.style.display = mobile ? 'block' : 'none';
      if (!mobile && this._menu) this._menu.style.display = 'none';
    };
    applyResponsive();
    window.addEventListener('resize', applyResponsive);
    const onScroll = () => {
      if (!this._header) return;
      if (this._track) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        this._track.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')';
      }
      if (this._tractor) {
        // Kleiner Traktor fährt mit dem Fortschrittsbalken mit; über Logo und Menüknopf wird er ausgeblendet.
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const p = max > 0 ? Math.min(1, window.scrollY / max) : 0;
        const w = this._header.clientWidth, x = p * w - 26;
        const logo = this._header.querySelector('a img')?.getBoundingClientRect();
        const burger = this._burger && this._burger.style.display !== 'none' ? this._burger.getBoundingClientRect() : null;
        const hide = p <= 0 || (logo && x < logo.right + 6) || (burger && x + 26 > burger.left - 6);
        this._tractor.style.transform = 'translateX(' + Math.max(0, x).toFixed(1) + 'px)';
        this._tractor.style.opacity = hide ? '0' : '1';
        const t = this._tractor.firstChild;
        if (t && !this._reduced) { t.classList.add('is-driving'); clearTimeout(this._stopT); this._stopT = setTimeout(() => t.classList.remove('is-driving'), 160); }
      }
      this._header.style.background = this.props.bg ?? 'rgba(255,255,255,0.95)';
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    // Fotos auf allen Seiten: beim Reinscrollen von unten aufdecken, große Startfotos danach langsam zoomen.
    if (!this._reduced && 'IntersectionObserver' in window) {
      const seen = new WeakSet();
      const io = new IntersectionObserver(es => {
        let n = 0;
        es.forEach(e => {
          if (!e.isIntersecting) return;
          const img = e.target.__hmImg; io.unobserve(e.target); if (!img) return;
          setTimeout(() => {
            img.classList.add('hm-in');
            setTimeout(() => {
              img.classList.remove('hm-ph', 'hm-phc', 'hm-in');
              if (img.getAttribute('fetchpriority') === 'high' && !img.dataset.parallax) img.classList.add('hm-kb');
            }, 1800);
          }, (n++) * 140);
        });
      }, { threshold: .15, rootMargin: '0px 0px -5% 0px' });
      const scan = () => document.querySelectorAll('img').forEach(img => {
        if (seen.has(img)) return; seen.add(img);
        const src = img.getAttribute('src') || '';
        if (!src || /\.svg$/.test(src) || src.includes('{{')) return;
        if (img.closest('header, footer, .gal-lb, .gal-cell, .erd-foto, [data-no-reveal]') || img.style.animation) return;
        // Beobachtet wird der Rahmen: ein ganz abgedecktes Bild zählt für den Browser als unsichtbar.
        const box = img.parentElement; if (!box || box.__hmImg) return;
        img.classList.add(img.dataset.parallax ? 'hm-phc' : 'hm-ph');
        box.__hmImg = img; io.observe(box);
      });
      requestAnimationFrame(scan); setTimeout(scan, 800);
      this._photoIo = io;
    }
    this._cleanup = () => { window.removeEventListener('resize', applyResponsive); window.removeEventListener('scroll', onScroll); };
  }
  componentWillUnmount() { if (this._cleanup) this._cleanup(); if (this._photoIo) this._photoIo.disconnect(); }
}
</script>
</body>
</html>
