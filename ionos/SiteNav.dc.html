<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/site.css">
<style>
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 3px solid #C8201E; outline-offset: 3px; border-radius: 2px; }
  a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
  p { text-wrap: pretty; }
  a[href^="tel:"] { font-variant-numeric: tabular-nums; }
  img:not([src$=".svg"]) { background-color: #E4E3E2; }
  a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  @media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
  @media (prefers-reduced-motion: no-preference) {
    img.hm-ph { clip-path: inset(100% 0 0 0); transform: scale(1.18); transition: clip-path 1.1s cubic-bezier(.77,0,.18,1), transform 1.7s cubic-bezier(.16,1,.3,1); }
    img.hm-phc { clip-path: inset(100% 0 0 0); transition: clip-path 1.1s cubic-bezier(.77,0,.18,1); }
    img.hm-ph.hm-in, img.hm-phc.hm-in { clip-path: inset(0 0 0 0); transform: scale(1); }
    img.hm-phc.hm-in { transform: none; }
    img.hm-kb { animation: hm-kb 22s ease-in-out infinite alternate; }
    @keyframes hm-kb { from { transform: scale(1); } to { transform: scale(1.08) translate3d(-1%, -1%, 0); } }
  }
  .hm-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:28px 40px; margin:0; padding:0; list-style:none; }
  .hm-facts li { border-top:2px solid currentColor; padding-top:16px; }
  .hm-facts .n { display:block; font-family:'Barlow',sans-serif; font-weight:800; font-size:clamp(40px,5vw,64px); line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .hm-facts .l { display:block; margin-top:10px; font-size:16px; line-height:1.45; opacity:.8; }
  /* Handy-Menü */
  .hm-burger { width:46px; height:46px; border:0; border-radius:14px; background:#F1F1F0; cursor:pointer; position:relative; padding:0; -webkit-tap-highlight-color:transparent; transition:background .2s ease; }
  .hm-burger:active { background:#E6E6E5; }
  .hm-burger span { position:absolute; left:13px; right:13px; height:2px; border-radius:2px; background:#1C1C1C; transition:transform .35s cubic-bezier(.76,0,.24,1), top .35s cubic-bezier(.76,0,.24,1); }
  .hm-burger span:first-child { top:18px; } .hm-burger span:last-child { top:26px; }
  .hm-burger.offen span:first-child { top:22px; transform:rotate(45deg); }
  .hm-burger.offen span:last-child { top:22px; transform:rotate(-45deg); }
  .hm-mmenu { position:fixed; left:0; right:0; top:var(--hm-kopf,71px); bottom:0; z-index:80; background:#FFFFFF; display:flex; flex-direction:column; justify-content:space-between; padding:18px 20px calc(22px + env(safe-area-inset-bottom)); overflow-y:auto; visibility:hidden; opacity:0; transform:translateY(-8px); transition:opacity .3s ease, transform .4s cubic-bezier(.16,1,.3,1), visibility 0s linear .4s; }
  .hm-mmenu.offen { visibility:visible; opacity:1; transform:none; transition:opacity .3s ease, transform .4s cubic-bezier(.16,1,.3,1), visibility 0s; }
  .hm-mlink { display:flex; align-items:baseline; gap:14px; padding:13px 2px; border-bottom:1px solid #EDEDEC; font-family:'Barlow',sans-serif; font-weight:800; font-size:clamp(26px,7.4vw,32px); letter-spacing:-.02em; line-height:1.1; text-decoration:none; opacity:0; transform:translateY(14px); transition:opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  .hm-mlink .nr { font-size:13px; font-weight:700; letter-spacing:0; color:#C8201E; min-width:20px; }
  .hm-mmenu.offen .hm-mlink { opacity:1; transform:none; }
  .hm-mmenu.offen .hm-mlink:nth-child(2) { transition-delay:.04s; } .hm-mmenu.offen .hm-mlink:nth-child(3) { transition-delay:.08s; }
  .hm-mmenu.offen .hm-mlink:nth-child(4) { transition-delay:.12s; } .hm-mmenu.offen .hm-mlink:nth-child(5) { transition-delay:.16s; }
  .hm-mmenu.offen .hm-mlink:nth-child(6) { transition-delay:.2s; }
  .hm-mfuss { margin-top:28px; }
  .hm-mtel { display:flex; align-items:center; gap:14px; min-height:62px; padding:0 20px; border-radius:18px; background:#C8201E; color:#FFFFFF !important; font-family:'Barlow',sans-serif; font-weight:700; font-size:18px; text-decoration:none; box-shadow:0 8px 20px rgba(200,32,30,.28); }
  .hm-mtel svg { width:22px; height:22px; flex:none; }
  .hm-mtel span { display:flex; flex-direction:column; line-height:1.1; }
  .hm-mtel small { font-weight:600; font-size:13px; opacity:.85; }
  .hm-madr { margin:16px 2px 0; font-family:'Barlow',sans-serif; font-size:14px; line-height:1.6; color:#5E5C5B; }
  .hm-madr a { color:#1C1C1C; }
  html.hm-menu-offen, html.hm-menu-offen body { overflow:hidden; }
  html.hm-menu-offen .hm-dock { display:none !important; }
  @media (prefers-reduced-motion: reduce) { .hm-mmenu, .hm-mlink, .hm-burger span { transition:none !important; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</helmet>
<header ref="{{ headerRef }}" style="view-transition-name:site-header;position:sticky;top:0;z-index:50;background:{{ headerBg }};border-bottom:1px solid {{ lineCol }};transition:box-shadow .3s ease,background .3s ease;font-family:'Source Serif 4',Georgia,serif;">
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:-1px;height:3px;pointer-events:none;"><div ref="{{ trackRef }}" style="height:100%;background:#C8201E;transform:scaleX(0);transform-origin:left center;will-change:transform;"></div></div>
  <div style="max-width:1200px;margin:0 auto;padding:12px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <a href="./" style="display:inline-flex;align-items:center;text-decoration:none;">
      <img src="logo.svg" alt="Lohnunternehmen Helmut Heiligmann" style="height:46px;display:block;" />
    </a>

    <nav style="display:flex;align-items:center;gap:26px;" ref="{{ deskNavRef }}">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="color:{{ l.col }};font-weight:{{ l.wt }};font-size:15px;text-decoration:none;transition:color .2s;" style-hover="color:#1C1C1C;">{{ l.label }}</a>
      </sc-for>
      <a href="tel:+491623478127" style="display:inline-flex;align-items:center;min-height:44px;color:#1C1C1C;font-family:'Barlow',sans-serif;font-weight:800;font-size:16px;text-decoration:none;" style-hover="color:#C8201E;"><span style="border-bottom:2px solid #E32523;padding-bottom:2px;">0162 3478127</span></a>
    </nav>

    <button class="hm-burger" onClick="{{ toggleNav }}" aria-label="Menü öffnen" aria-expanded="false" style="display:none;" ref="{{ burgerRef }}"><span></span><span></span></button>
  </div>

  <div class="hm-mmenu" ref="{{ mobileMenuRef }}" aria-hidden="true">
    <nav class="hm-mlinks" aria-label="Hauptmenü">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a class="hm-mlink" href="{{ l.href }}" onClick="{{ closeNav }}" aria-current="{{ l.cur }}" style="color:{{ l.mcol }};"><span class="nr">{{ l.no }}</span>{{ l.label }}</a>
      </sc-for>
    </nav>
    <div class="hm-mfuss">
      <a class="hm-mtel" href="tel:+491623478127"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span>Jetzt anrufen<small>0162 3478127</small></span></a>
      <p class="hm-madr">Oberfeldstraße 15 · 89343 Freihalden<br><a href="mailto:Lohnunternehmen.heiligmann@gmx.de">Lohnunternehmen.heiligmann@gmx.de</a></p>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;erd&quot;,&quot;lw&quot;,&quot;angus&quot;,&quot;galerie&quot;,&quot;kontakt&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;ctaColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C8201E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trustColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C8201E&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const accent = this.props.trustColor ?? '#C8201E';
    const defs = [
      { label: 'Start', href: './', key: 'home' },
      { label: 'Erdarbeiten', href: 'erdarbeiten.html', key: 'erd' },
      { label: 'Landwirtschaft', href: 'landwirtschaft.html', key: 'lw' },
      { label: 'Angusrinder', href: 'angusrinder.html', key: 'angus' },
      { label: 'Galerie', href: 'galerie.html', key: 'galerie' },
      { label: 'Kontakt', href: 'kontakt.html', key: 'kontakt' },
    ];
    const links = defs.map((d, i) => {
      const on = d.key === active;
      return { ...d, no: String(i + 1).padStart(2, '0'), cur: on ? 'page' : 'false', col: on ? accent : '#4E4C4B', mcol: on ? accent : '#1C1C1C', wt: on ? 700 : 500 };
    });
    return {
      links,
      ctaColor: this.props.ctaColor ?? '#C8201E',
      headerBg: this.props.bg ?? 'rgba(255,255,255,0.95)',
      menuBg: this.props.bg ?? '#FFFFFF',
      lineCol: this.props.line ?? '#E7E7E6',
      headerRef: (el) => { this._header = el; },
      trackRef: (el) => { this._track = el; },
      deskNavRef: (el) => { this._deskNav = el; },
      burgerRef: (el) => { this._burger = el; },
      mobileMenuRef: (el) => { this._menu = el; },
      toggleNav: () => this._setMenu(!(this._menu && this._menu.classList.contains('offen'))),
      closeNav: () => this._setMenu(false),
    };
  }
  componentDidMount() {
    // Beim Seitenwechsel immer oben anfangen (außer bei Sprungmarken wie #kontakt)
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    if (!location.hash) window.scrollTo(0, 0);
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const applyResponsive = () => {
      const mobile = window.innerWidth < 1080;
      if (this._deskNav) this._deskNav.style.display = mobile ? 'none' : 'flex';
      if (this._burger) this._burger.style.display = mobile ? 'block' : 'none';
      if (!mobile) this._setMenu(false);
      if (this._header) document.documentElement.style.setProperty('--hm-kopf', this._header.offsetHeight + 'px');
    };
    applyResponsive();
    window.addEventListener('resize', applyResponsive);
    const onScroll = () => {
      if (!this._header) return;
      if (this._track) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        this._track.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')';
      }
      this._header.style.background = this.props.bg ?? 'rgba(255,255,255,0.95)';
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    // Fotos auf allen Seiten: beim Reinscrollen von unten aufdecken, große Startfotos danach langsam zoomen.
    if (!this._reduced && 'IntersectionObserver' in window) {
      const seen = new WeakSet();
      const io = new IntersectionObserver(es => {
        let n = 0;
        es.forEach(e => {
          if (!e.isIntersecting) return;
          const img = e.target.__hmImg; io.unobserve(e.target); if (!img) return;
          setTimeout(() => {
            img.classList.add('hm-in');
            setTimeout(() => {
              img.classList.remove('hm-ph', 'hm-phc', 'hm-in');
              if (img.getAttribute('fetchpriority') === 'high' && !img.dataset.parallax) img.classList.add('hm-kb');
            }, 1800);
          }, (n++) * 140);
        });
      }, { threshold: .15, rootMargin: '0px 0px -5% 0px' });
      const scan = () => document.querySelectorAll('img').forEach(img => {
        if (seen.has(img)) return; seen.add(img);
        const src = img.getAttribute('src') || '';
        if (!src || /\.svg$/.test(src) || src.includes('{{')) return;
        if (img.hasAttribute('data-no-reveal') || img.closest('header, footer, .gal-lb, .gal-cell, .erd-foto, [data-no-reveal]') || img.style.animation) return;
        // Beobachtet wird der Rahmen: ein ganz abgedecktes Bild zählt für den Browser als unsichtbar.
        const box = img.parentElement; if (!box || box.__hmImg) return;
        img.classList.add(img.dataset.parallax ? 'hm-phc' : 'hm-ph');
        box.__hmImg = img; io.observe(box);
      });
      requestAnimationFrame(scan); setTimeout(scan, 800);
      // Key Facts: Zahlen mit data-countup zählen hoch, sobald sie sichtbar werden
      const cio = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return; cio.unobserve(e.target);
        const el = e.target, to = +el.dataset.countup, from = +(el.dataset.from || 0), suf = el.dataset.suffix || '', t0 = performance.now(), dur = 1800;
        const step = t => { const k = Math.min(1, (t - t0) / dur), q = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(from + (to - from) * q) + suf; if (k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      }), { threshold: .6 });
      const scanCount = () => document.querySelectorAll('[data-countup]').forEach(el => { if (el.__hmc) return; el.__hmc = 1; el.textContent = (el.dataset.from || 0) + (el.dataset.suffix || ''); cio.observe(el); });
      requestAnimationFrame(scanCount); setTimeout(scanCount, 800);
      // Wisch-Reihen (data-autoscroll): beim Runterscrollen automatisch nach rechts mitlaufen.
      // Greift nur, wenn die Reihe breiter ist als der Bildschirm (also am Handy).
      const reihen = () => Array.from(document.querySelectorAll('[data-autoscroll]'));
      const mitlaufen = () => {
        const vh = window.innerHeight;
        reihen().forEach(el => {
          const max = el.scrollWidth - el.clientWidth; if (max < 4) return;
          if (el.__hand && Date.now() - el.__hand < 1500) return; // gerade selbst gewischt
          const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
          const p = Math.max(0, Math.min(1, (vh * 0.8 - r.top) / (vh * 0.55)));
          el.scrollLeft = p * max;
        });
      };
      const merke = e => { const el = e.target.closest && e.target.closest('[data-autoscroll]'); if (el) el.__hand = Date.now(); };
      document.addEventListener('touchstart', merke, { passive: true });
      document.addEventListener('touchmove', merke, { passive: true });
      let rt = false;
      window.addEventListener('scroll', () => { if (rt) return; rt = true; requestAnimationFrame(() => { rt = false; mitlaufen(); }); }, { passive: true });
      setTimeout(mitlaufen, 900);
      this._photoIo = io;
    }
    this._cleanup = () => { window.removeEventListener('resize', applyResponsive); window.removeEventListener('scroll', onScroll); };
  }
  _setMenu(auf) {
    if (!this._menu || !this._burger) return;
    if (auf && this._header) document.documentElement.style.setProperty('--hm-kopf', this._header.getBoundingClientRect().bottom + 'px');
    this._menu.classList.toggle('offen', auf); this._burger.classList.toggle('offen', auf);
    this._menu.setAttribute('aria-hidden', auf ? 'false' : 'true');
    this._burger.setAttribute('aria-expanded', auf ? 'true' : 'false');
    this._burger.setAttribute('aria-label', auf ? 'Menü schließen' : 'Menü öffnen');
    document.documentElement.classList.toggle('hm-menu-offen', auf);
    if (!this._escAn) { this._escAn = true; document.addEventListener('keydown', e => { if (e.key === 'Escape') this._setMenu(false); }); }
  }
  componentWillUnmount() { if (this._cleanup) this._cleanup(); if (this._photoIo) this._photoIo.disconnect(); }
}
</script>
</body>
</html>
