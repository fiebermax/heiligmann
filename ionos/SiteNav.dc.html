<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/site.css">
<style>
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 3px solid #2E7D32; outline-offset: 3px; border-radius: 2px; }
  a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
  p { text-wrap: pretty; }
  a[href^="tel:"] { font-variant-numeric: tabular-nums; }
  img:not([src$=".svg"]) { background-color: #E6E2D8; }
  a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  @media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</helmet>
<header ref="{{ headerRef }}" style="view-transition-name:site-header;position:sticky;top:0;z-index:50;background:{{ headerBg }};backdrop-filter:blur(14px);border-bottom:1px solid {{ lineCol }};transition:box-shadow .3s ease,background .3s ease;font-family:'Source Serif 4',Georgia,serif;">
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:3px;pointer-events:none;"><div ref="{{ trackRef }}" style="height:100%;background:#2E7D32;transform:scaleX(0);transform-origin:left center;will-change:transform;"></div></div>
  <div style="max-width:1200px;margin:0 auto;padding:12px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <a href="./" style="display:inline-flex;align-items:center;text-decoration:none;">
      <img src="logo.svg" alt="Lohnunternehmen Helmut Heiligmann" style="height:46px;display:block;" />
    </a>

    <nav style="display:flex;align-items:center;gap:26px;" ref="{{ deskNavRef }}">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="color:{{ l.col }};font-weight:{{ l.wt }};font-size:15px;text-decoration:none;transition:color .2s;" style-hover="color:#1a1e25;">{{ l.label }}</a>
      </sc-for>
      <a href="tel:+491623478127" style="display:inline-flex;align-items:center;min-height:44px;color:#1a1e25;font-family:'Barlow',sans-serif;font-weight:800;font-size:16px;text-decoration:none;" style-hover="color:#2E7D32;"><span style="border-bottom:2px solid #E32523;padding-bottom:2px;">0162 3478127</span></a>
    </nav>

    <button onClick="{{ toggleNav }}" aria-label="Menü" style="display:none;background:transparent;border:1px solid #d5d9d3;color:#1a1e25;width:46px;height:46px;border-radius:4px;font-size:22px;cursor:pointer;" ref="{{ burgerRef }}">☰</button>
  </div>

  <div ref="{{ mobileMenuRef }}" style="display:none;flex-direction:column;padding:8px 18px 20px;border-top:1px solid {{ lineCol }};background:{{ menuBg }};">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
      <a href="{{ l.href }}" onClick="{{ closeNav }}" style="display:block;min-height:48px;color:{{ l.mcol }};font-weight:600;padding:15px 6px;border-bottom:1px solid #eef0ec;text-decoration:none;">{{ l.label }}</a>
    </sc-for>
    <a href="tel:+491623478127" style="margin-top:14px;text-align:center;background:{{ ctaColor }};color:#fff;font-weight:700;padding:15px;border-radius:4px;text-decoration:none;">Jetzt anrufen: 0162 3478127</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;erd&quot;,&quot;lw&quot;,&quot;angus&quot;,&quot;galerie&quot;,&quot;kontakt&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;ctaColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#388E3C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trustColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2E7D32&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const accent = this.props.trustColor ?? '#2E7D32';
    const defs = [
      { label: 'Start', href: './', key: 'home' },
      { label: 'Erdarbeiten', href: 'erdarbeiten.html', key: 'erd' },
      { label: 'Landwirtschaft', href: 'landwirtschaft.html', key: 'lw' },
      { label: 'Angusrinder', href: 'angusrinder.html', key: 'angus' },
      { label: 'Galerie', href: 'galerie.html', key: 'galerie' },
      { label: 'Kontakt', href: 'kontakt.html', key: 'kontakt' },
    ];
    const links = defs.map(d => {
      const on = d.key === active;
      return { ...d, col: on ? accent : '#4a545e', mcol: on ? accent : '#1a1e25', wt: on ? 700 : 500 };
    });
    return {
      links,
      ctaColor: this.props.ctaColor ?? '#388E3C',
      headerBg: this.props.bg ?? 'rgba(246,244,238,0.95)',
      menuBg: this.props.bg ?? '#F6F4EE',
      lineCol: this.props.line ?? '#e7e9e5',
      headerRef: (el) => { this._header = el; },
      trackRef: (el) => { this._track = el; },
      deskNavRef: (el) => { this._deskNav = el; },
      burgerRef: (el) => { this._burger = el; },
      mobileMenuRef: (el) => { this._menu = el; },
      toggleNav: () => { if (this._menu) this._menu.style.display = this._menu.style.display === 'flex' ? 'none' : 'flex'; },
      closeNav: () => { if (this._menu) this._menu.style.display = 'none'; },
    };
  }
  componentDidMount() {
    const applyResponsive = () => {
      const mobile = window.innerWidth < 1080;
      if (this._deskNav) this._deskNav.style.display = mobile ? 'none' : 'flex';
      if (this._burger) this._burger.style.display = mobile ? 'block' : 'none';
      if (!mobile && this._menu) this._menu.style.display = 'none';
    };
    applyResponsive();
    window.addEventListener('resize', applyResponsive);
    const onScroll = () => {
      if (!this._header) return;
      if (this._track) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        this._track.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ')';
      }
      this._header.style.background = this.props.bg ?? 'rgba(246,244,238,0.95)';
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    this._cleanup = () => { window.removeEventListener('resize', applyResponsive); window.removeEventListener('scroll', onScroll); };
  }
  componentWillUnmount() { if (this._cleanup) this._cleanup(); }
}
</script>
</body>
</html>
