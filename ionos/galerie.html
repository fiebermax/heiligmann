<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Galerie – Lohnunternehmen Heiligmann</title>
<meta name="description" content="Fotos von unseren Erdarbeiten, Maschinen, der Landwirtschaft und der Angus-Herde.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/site.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  a { color: #2E7D32; }
  a:hover { color: #256b29; }
  ::selection { background: #388E3C; color: #fff; }
  .gal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .gal-cell { position:relative; aspect-ratio:4/3; border-radius:4px; overflow:hidden; border:1px solid #e6e8e4; background:#f3f4f6; transition: transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s ease; }
  .gal-cell { padding:0; cursor:zoom-in; display:block; width:100%; }
  .gal-cell img { transition: transform .6s cubic-bezier(.16,1,.3,1), filter .4s ease; }
  @media (hover:hover) { .gal-cell:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(26,30,37,.14); } .gal-cell:hover img { transform: scale(1.06); filter: saturate(1.1); } }
  .gal-cell.is-hidden { opacity:0; transform: translateY(28px) scale(.96); }
  .gal-cell.is-in { opacity:1; transform:none; transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1), box-shadow .35s ease; }
  .gal-lb { position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:56px 16px; background:rgba(20,24,20,.92); }
  .gal-lb button { font-family:'Barlow',sans-serif; font-weight:700; color:#fff; background:rgba(255,255,255,.12); border:0; border-radius:999px; cursor:pointer; min-width:48px; min-height:48px; font-size:22px; }
  .gal-lb button:hover { background:rgba(255,255,255,.24); }
</style>
</helmet>
<div style="background:#F6F4EE;color:#55606b;font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.65;overflow-x:clip;min-height:100vh;">
  <dc-import name="SiteNav" style="position:sticky;top:0;z-index:60;" active="galerie" hint-size="100%,72px"></dc-import>

  <section style="max-width:1200px;margin:0 auto;padding:60px 22px 30px;">
    <span style="display:inline-block;font-family:'Barlow';font-weight:600;color:#2E7D32;letter-spacing:.16em;text-transform:uppercase;font-size:14px;margin-bottom:16px;">Einblicke</span>
    <h1 style="font-family:'Barlow';font-weight:800;font-size:clamp(36px,5.5vw,60px);line-height:1.04;letter-spacing:-.02em;color:#1a1e25;margin:0 0 16px;">Galerie</h1>
    <p style="font-size:clamp(17px,2vw,20px);color:#6b7480;margin:0;max-width:640px;">Ein Blick auf unsere Arbeit: Baustellen, Feldarbeit und unsere Herde. Tippen Sie auf ein Foto, um es groß anzusehen.</p>
  </section>

  <div style="max-width:1200px;margin:0 auto;padding:24px 22px 20px;min-height:60vh;">{{ gallery }}</div>
  {{ lightbox }}

  <section style="margin-top:40px;background:#EDEAE2;border-top:1px solid #e7e9e5;">
    <div style="max-width:1000px;margin:0 auto;padding:64px 22px;text-align:center;">
      <h2 style="font-family:'Barlow';font-weight:800;font-size:clamp(24px,3.4vw,34px);color:#1a1e25;margin:0 0 14px;letter-spacing:-.02em;">Gefällt Ihnen, was Sie sehen?</h2>
      <p style="color:#6b7480;margin:0 auto 28px;max-width:500px;">Dann lassen Sie uns über Ihr Projekt sprechen.</p>
      <a href="kontakt.html" style="display:inline-flex;align-items:center;gap:10px;background:#2E7D32;color:#fff;font-weight:700;font-size:17px;padding:17px 30px;border-radius:4px;text-decoration:none;">Kontakt aufnehmen</a>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
// Bilder kommen aus data/galerie.json (gepflegt über /verwaltung/).
// Solange dort noch nichts gespeichert wurde, gilt data/galerie.start.json.
class Component extends DCLogic {
  state = { data: null, open: -1 };
  componentDidMount() {
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const load = url => fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); });
    load('data/galerie.json').catch(() => load('data/galerie.start.json')).then(data => this.setState({ data })).catch(() => this.setState({ data: { kategorien: [], bilder: [] } }));
    this._key = e => {
      if (this.state.open < 0) return;
      if (e.key === 'Escape') this.close();
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentDidUpdate() {
    if (!this.state.data || this._observed) return;
    this._observed = true;
    const cells = Array.from(document.querySelectorAll('.gal-cell'));
    if (this._reduced || !('IntersectionObserver' in window)) return;
    cells.forEach(c => c.classList.add('is-hidden'));
    this._io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const c = e.target, row = Math.round(c.offsetLeft / Math.max(1, c.offsetWidth));
      setTimeout(() => { c.classList.add('is-in'); c.classList.remove('is-hidden'); }, row * 90);
      this._io.unobserve(c);
    }), { threshold: .15 });
    cells.forEach(c => this._io.observe(c));
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); if (this._io) this._io.disconnect(); }
  list() { const d = this.state.data; if (!d) return []; const order = d.kategorien.map(k => k.id); return d.bilder.slice().sort((a, b) => order.indexOf(a.kategorie) - order.indexOf(b.kategorie)); }
  openAt(i, el) {
    this._from = el ? el.getBoundingClientRect() : null; this._opener = el;
    this.setState({ open: i }, () => {
      document.body.style.overflow = 'hidden';
      const img = document.querySelector('.gal-lb img');
      if (!img || this._reduced) return;
      const run = () => {
        const to = img.getBoundingClientRect(), f = this._from;
        if (f && to.width) {
          const sx = f.width / to.width, sy = f.height / to.height;
          img.animate([{ transform: `translate(${f.left - to.left}px,${f.top - to.top}px) scale(${sx},${sy})`, transformOrigin: '0 0', borderRadius: '4px' }, { transform: 'none', transformOrigin: '0 0', borderRadius: '4px' }], { duration: 420, easing: 'cubic-bezier(.16,1,.3,1)' });
        }
        document.querySelector('.gal-lb').animate([{ backgroundColor: 'rgba(20,24,20,0)' }, { backgroundColor: 'rgba(20,24,20,.92)' }], { duration: 300 });
      };
      if (img.complete) run(); else img.addEventListener('load', run, { once: true });
      document.querySelector('.gal-lb [data-close]')?.focus();
    });
  }
  close() { this.setState({ open: -1 }); document.body.style.overflow = ''; if (this._opener) this._opener.focus(); }
  step(d) { const n = this.list().length; this.setState({ open: (this.state.open + d + n) % n }); }
  renderVals() {
    const h = React.createElement, d = this.state.data, all = this.list();
    const H2 = { fontFamily: 'Barlow', fontWeight: 700, fontSize: 24, color: '#1a1e25', margin: 0 };
    const gallery = !d ? h('p', { style: { color: '#6b7480' } }, 'Fotos werden geladen …') :
      h('div', null, ...d.kategorien.map(k => {
        const items = all.map((b, i) => ({ b, i })).filter(x => x.b.kategorie === k.id);
        if (!items.length) return null;
        return h('section', { key: k.id, style: { marginBottom: 44 } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 14, marginBottom: 20 } }, h('h2', { style: H2 }, k.titel), h('span', { style: { flex: 1, height: 1, background: '#e6e8e4' } })),
          h('div', { className: 'gal-grid' }, ...items.map(({ b, i }) => h('button', { key: b.id, type: 'button', className: 'gal-cell', 'aria-label': 'Foto vergrößern: ' + b.alt, onClick: e => this.openAt(i, e.currentTarget) },
            h('img', { src: b.vorschau || b.bild, alt: b.alt, loading: 'lazy', decoding: 'async', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' } })))));
      }));
    const cur = all[this.state.open];
    const lightbox = !cur ? null : h('div', { className: 'gal-lb', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Fotoansicht', onClick: e => { if (e.target === e.currentTarget) this.close(); } },
      h('img', { key: cur.id, src: cur.bild, alt: cur.alt, style: { maxWidth: '100%', maxHeight: 'calc(100vh - 150px)', objectFit: 'contain', borderRadius: 4, boxShadow: '0 30px 80px rgba(0,0,0,.45)', background: 'transparent' } }),
      h('div', { style: { position: 'absolute', left: 0, right: 0, bottom: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, color: '#fff', fontFamily: 'Barlow' } },
        h('button', { type: 'button', 'aria-label': 'Vorheriges Foto', onClick: () => this.step(-1) }, '‹'),
        h('span', { style: { minWidth: 260, maxWidth: '50vw', textAlign: 'center', fontSize: 15, opacity: .9 } }, cur.alt + '  ·  ' + (this.state.open + 1) + ' / ' + all.length),
        h('button', { type: 'button', 'aria-label': 'Nächstes Foto', onClick: () => this.step(1) }, '›')),
      h('button', { type: 'button', 'data-close': true, 'aria-label': 'Schließen', onClick: () => this.close(), style: { position: 'absolute', top: 12, right: 12 } }, '✕'));
    return { gallery, lightbox };
  }
}
</script>
</body>
</html>
